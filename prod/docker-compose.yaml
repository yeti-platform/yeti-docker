services:

  frontend:
    image: yetiplatform/yeti-frontend:${YETI_IMAGE_TAG:-latest}
    ports:
      - 80:80
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

  api:
    image: yetiplatform/yeti:${YETI_IMAGE_TAG:-latest}
    env_file:
      - ${YETI_DOCKER_ENVFILE}
    entrypoint:
      - /docker-entrypoint.sh
    command: ["webserver"]
    environment:
      - YETI_CHROMADB_HTTP_ROOT=http://chromadb:8000
    ports:
      - 8001:8000
    depends_on:
      redis:
        condition: service_started
      arangodb:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - yeti-exports:/opt/yeti/exports

  tasks:
    image: yetiplatform/yeti:${YETI_IMAGE_TAG:-latest}
    env_file:
      - ${YETI_DOCKER_ENVFILE}
    command: ['tasks']
    environment:
      - YETI_CHROMADB_HTTP_ROOT=http://chromadb:8000
    depends_on:
      redis:
        condition: service_started
      arangodb:
        condition: service_healthy
      api:
        condition: service_started
      chromadb:
        condition: service_started
    volumes:
      - yeti-exports:/opt/yeti/exports

  events-tasks:
    image: yetiplatform/yeti:${YETI_IMAGE_TAG:-latest}
    env_file:
      - ${YETI_DOCKER_ENVFILE}
    command: ['events-tasks']
    depends_on:
      redis:
        condition: service_started
      arangodb:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - yeti-exports:/opt/yeti/exports

  tasks-beat:
    image: yetiplatform/yeti:${YETI_IMAGE_TAG:-latest}
    env_file:
      - ${YETI_DOCKER_ENVFILE}
    command: ['tasks-beat']
    depends_on:
      redis:
        condition: service_started
      arangodb:
        condition: service_healthy

  # Owns the semantic search index. The API queries it and the task workers
  # write to it, and going through a server rather than a shared directory is
  # what lets those run on different hosts: the embedded backend is SQLite, so
  # each process opening the files directly gets its own copy of the data.
  #
  # Only vectors cross this boundary -- Yeti embeds text in its own process --
  # so this service never needs the embedding model and works with no internet
  # access. Keep the tag in step with the `chromadb` pin in yeti's pyproject.
  #
  # No healthcheck: the image ships no HTTP client to probe with, so
  # service_started is the strongest condition available. Yeti connects when it
  # first indexes or searches rather than at startup, so a late-ready server
  # costs an early request, not the process.
  chromadb:
    image: chromadb/chroma:1.5.7
    volumes:
      - yeti-chromadb-data:/data

  redis:
    image: redis:latest

  arangodb:
    image: arangodb:3.11
    restart: unless-stopped
    environment:
      - ARANGO_ROOT_PASSWORD=
    volumes:
      - yeti-db:/var/lib/arangodb3
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.endpoint tcp://127.0.0.1:8529 --server.username root --server.password \"$$ARANGO_ROOT_PASSWORD\" --javascript.execute-string 'db._version()' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  # bloomcheck/agents only ever publish a :dev tag today (no :latest, no
  # numbered releases) -- pinned here independent of YETI_IMAGE_TAG so
  # bumping that for a yeti/yeti-frontend release doesn't break these pulls.
  # Move to a numbered tag or :latest once these images stabilize.
  bloomcheck:
    image: yetiplatform/bloomcheck:dev
    entrypoint: ['/app/bloomcheck', '-serve', '/bloomfilters']
    volumes:
      - ${YETI_BLOOM_FILTERS_DIR}:/bloomfilters:ro

  agents:
    image: yetiplatform/yeti-agents:dev
    env_file:
      - ${YETI_DOCKER_ENVFILE}
    environment:
      - YETI_AGENTS_DB_PATH=/data/sessions.db
    volumes:
      - yeti-agents-data:/data

networks:
  default:
    name: yeti_prod_network

volumes:
  yeti-agents-data:
    driver: local
  yeti-exports:
    driver: local
  yeti-db:
    driver: local
  yeti-chromadb-data:
    driver: local
